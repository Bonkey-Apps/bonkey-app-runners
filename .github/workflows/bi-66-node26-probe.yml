# BI-66 PROBE — throwaway measurement, branch BI-66 only. Never merge to main.
#
# Question: does Node 26 install and run on the org self-hosted Docker runner,
# through setup-node@v7 (what Cards asked about) and setup-node@v5 (what
# bonkey-org's setup-js calls), and does the toolcache survive the runner's
# ephemeral recycle? Job b runs on a FRESH ephemeral registration after job a,
# so it is itself one recycle measurement; a second push gives another.
name: BI-66 Node 26 probe

on:
  push:
    branches: [BI-66]

permissions:
  contents: read

concurrency:
  group: bi-66-node26-probe
  cancel-in-progress: false

jobs:
  probe-v7:
    name: "a: setup-node@v7 node 26"
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - name: Before — runner, on-box node, toolcache, DNS
        shell: bash
        run: |
          echo "runner=$RUNNER_NAME tool_cache=$RUNNER_TOOL_CACHE"
          echo "on-box node: $(command -v node) $(node -v)"
          echo "NODE_OPTIONS=${NODE_OPTIONS:-unset}"
          echo "toolcache node dirs:"; ls -la --time-style=+%FT%T "$RUNNER_TOOL_CACHE/node" 2>&1 || true
          echo "resolv.conf:"; grep -v '^#' /etc/resolv.conf
          for h in github.com api.github.com raw.githubusercontent.com objects.githubusercontent.com release-assets.githubusercontent.com nodejs.org registry.npmjs.org; do
            r="$(getent hosts "$h" | head -1)"; printf '%-40s %s\n' "$h" "${r:-UNRESOLVED}"
          done

      - name: setup-node@v7 node 26
        id: setup
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: After — node 26 and the baked pnpm/corepack under it
        shell: bash
        run: |
          set -x
          command -v node; node --version; npm --version
          node -p 'process.versions.node + " v8=" + process.versions.v8 + " heapMB=" + Math.round(require("v8").getHeapStatistics().heap_size_limit/1048576)'
          ls "$(dirname "$(command -v node)")"
          command -v corepack || echo "no corepack on PATH"
          corepack --version || echo "corepack failed"
          command -v pnpm; head -1 "$(command -v pnpm)"
          pnpm --version
          # pnpm actually doing work under node 26, offline (no deps)
          d="$RUNNER_TEMP/pnpm-probe"; mkdir -p "$d"; cd "$d"
          printf '{"name":"probe","version":"1.0.0","private":true,"packageManager":"pnpm@10.33.0"}\n' > package.json
          pnpm install
          pnpm exec node -p 'process.version'
          ls -la --time-style=+%FT%T "$RUNNER_TOOL_CACHE/node"

  probe-v5:
    name: "b: setup-node@v5 node 26"
    needs: probe-v7
    if: always()
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - name: Before — runner, on-box node, toolcache
        shell: bash
        run: |
          echo "runner=$RUNNER_NAME tool_cache=$RUNNER_TOOL_CACHE"
          echo "on-box node: $(command -v node) $(node -v)"
          echo "toolcache node dirs:"; ls -la --time-style=+%FT%T "$RUNNER_TOOL_CACHE/node" 2>&1 || true

      - name: setup-node@v5 node 26
        id: setup
        uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: After — node 26 and the baked pnpm under it
        shell: bash
        run: |
          set -x
          command -v node; node --version; npm --version
          command -v corepack || echo "no corepack on PATH"
          pnpm --version
          d="$RUNNER_TEMP/pnpm-probe"; mkdir -p "$d"; cd "$d"
          printf '{"name":"probe","version":"1.0.0","private":true,"packageManager":"pnpm@10.33.0"}\n' > package.json
          pnpm install
          ls -la --time-style=+%FT%T "$RUNNER_TOOL_CACHE/node"
