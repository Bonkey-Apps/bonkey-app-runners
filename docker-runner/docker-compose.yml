# Bonkey Apps — local self-hosted org runner.
#
#   cp .env.example .env   # fill in GH_PAT
#   docker compose up --build -d
#   docker compose logs -f
#
# Default platform is linux/amd64 so the runner reports `x64` and matches the
# repo's `runs-on: [self-hosted, linux, x64]` jobs. On Apple Silicon this runs
# under Rosetta (enable "Use Rosetta" in Docker Desktop → Settings → General).
# To run native arm64 instead, set RUNNER_PLATFORM=linux/arm64 in .env — but
# note x64-only jobs then won't schedule on it.
# Shared runner definition. Anchored so every runner service is byte-identical
# except for its cpuset — see the note on cpuset below.
x-runner-base: &runner
    build:
      context: .
      args:
        RUNNER_VERSION: ${RUNNER_VERSION:-2.335.1}
        PNPM_VERSION: ${PNPM_VERSION:-10.33.0}
        # One Chromium revision per @playwright/test pin in use; all three app
        # repos are on 1.62.1 as of BC-138. See the Dockerfile.
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:-1.62.1}
        # Bake the Java/Android-SDK/bundletool build toolchain (amd64 only).
        # Set false in .env for a lean JS/web-only image or an arm64 build.
        INSTALL_ANDROID: ${INSTALL_ANDROID:-true}
    # Published to GHCR by .github/workflows/build-docker-runner-image.yml.
    # `docker compose pull` fetches this prebuilt image; `up --build` rebuilds
    # it locally under the same tag.
    image: ${RUNNER_IMAGE:-ghcr.io/bonkey-apps/bonkey-apps-runner:latest}
    platform: ${RUNNER_PLATFORM:-linux/amd64}
    # NOTE: `cpuset` is deliberately absent from this shared block — it is the
    # one setting that must DIFFER per runner, so each service sets its own.
    #
    # Why cpuset at all: it pins the CONTAINER to a smaller core SET, and that
    # is what actually throttles ninja's native-build concurrency. AGP invokes
    # ninja directly, so neither Gradle's --max-workers nor
    # CMAKE_BUILD_PARALLEL_LEVEL reach it (measured on bonkey-cards-app#1032:
    # 3 release runs, 3 --max-workers settings, zero effect on concurrent
    # clang++ count) — ninja instead picks its own -j from `nproc`. Docker's
    # time-quota `cpus:` does NOT change what nproc reports inside the
    # container (verified empirically — still reports the host's full core
    # count under a `cpus` quota); only `cpuset:` (core pinning) does.
    #
    # Why the sets must be DISJOINT: `up --scale runner=N` applies ONE cpuset
    # to every replica, so N runners all land on the SAME cores — N concurrent
    # jobs contending for 2 cores while the rest of the host sits idle
    # (observed 2026-08-23: two runners both pinned to 0-1 of a 24-core host,
    # nproc=2 in each). That is why extra runners are separate SERVICES with
    # their own cpuset rather than replicas. Do NOT use --scale here.
    #
    # Core-index string, e.g. "0-1" = 2 cores, "0-5" = 6 cores -- keep
    # BONKEY_NATIVE_BUILD_JOBS's default in entrypoint.sh in lockstep with
    # however many cores EACH service pins (currently 6).
    # --- Memory ------------------------------------------------------------
    # Runners ran with NO memory limit until now, so an overrunning build was
    # killed by the VM-WIDE OOM killer, which picks its own victim: the other
    # runner's job, or a runner agent, showing up as a job that dies with an
    # unreadable log rather than an attributable failure. A per-container limit
    # makes the overrun land on the container that caused it, where it surfaces
    # as `OOMKilled=true` in `docker inspect` and the ephemeral restart brings
    # a clean runner straight back.
    #
    # bonkey-cards-app has been paying for this gap from the app side: its
    # release workflow caps `--max-workers` AND injects CMake job pools because
    # the kernel kept killing the Gradle daemon mid-compile ("Gradle build
    # daemon disappeared unexpectedly", issue #1032). That workflow's own note
    # says the remaining levers -- "heap sizing, a smaller ABI set, a bigger
    # box" -- live outside the app repo. Heap sizing is this file's job.
    #
    # BUDGET, not a guess: measured 2026-08-23 the Docker VM has 15.31 GiB
    # total. Two runners at 6g leave ~3 GiB for the VM itself and the other
    # containers on the host. Running `--profile x3` at this default would
    # commit 18g against 15.31 and is NOT safe -- lower RUNNER_MEM_LIMIT to 4g
    # for a 3-runner layout, and treat that as a JS/web-job configuration, not
    # one for native Android builds.
    # Raised 6g -> 8g and CAPPED THERE by owner decision, 2026-08-26 (BI-24).
    #
    # Why it was raised: the Cards Android release OOM-killed at
    # ':app:createBundleReleaseJsAndAssets' with exit 137 (SIGKILL). The
    # arithmetic that has to fit inside this limit, on this host:
    #
    #   Node's bundler heap   ~4 GiB   (V8's default max-old-space on a 64-bit
    #                                   host; NOT capped explicitly anywhere)
    #   Gradle/Java           2 GiB    (JAVA_TOOL_OPTIONS -Xmx2g, below)
    #   toolchain + overhead  ~1 GiB
    #                         -------
    #                         ~7 GiB   -- which does not fit in 6g, and does in 8g.
    #
    # RAISED 8g -> 12g by owner decision, 2026-08-28 (BI-27), after a SECOND
    # OOM kill at 8g. The 8g arithmetic above was measured on the phase that
    # died in 0.11.27; the phase that dies now is a different one, and the
    # per-process table from the kernel dump prices it properly:
    #
    #   JVMs      3 procs   4621 MiB   (2986 + 1530 + 105 -- THREE, not one)
    #   clang++  14 procs   3378 MiB   (avg 241 MiB, max 678 -- not ~1 GiB each)
    #   ninja                  4 MiB
    #                       --------
    #                       8003 MiB   = 7.82 GiB against an 8 GiB cap
    #
    # It was not one heavy process overrunning; it was the sum arriving exactly
    # at the wall. 12g leaves ~4.2 GiB of headroom on the same workload.
    #
    # What the previous "capped at 8g" reasoning got right and wrong: the
    # caution about host-wide pressure is real and still applies. But the cap
    # was ALSO justified by fitting two runners at 8g -- and only one has ever
    # been started (runner-2/runner-3 sit behind the x2/x3 profiles, off by
    # default). Sizing one runner for a second that does not exist bought
    # nothing and cost two 100-minute release builds.
    #
    # Measured before raising, on this host: Docker VM 15,674 MiB total /
    # 14,427 MiB available; Windows host 31.38 GB total / 13.78 GB free.
    # Raising this does not enlarge the VM -- it lets the container use more of
    # the VM it already has -- so the ceiling is still the VM's 15.31 GiB.
    #
    # NOT verified: whether the household Pi-hole VM is currently running.
    # `Get-VM` returned no rows, which on Windows can mean no VMs OR no
    # privilege, so treat that as unknown rather than as "it is off". The host
    # free figure above is measured with whatever is actually running.
    #
    # REDUCED 12g -> 8g and 12 cores -> 6 by owner decision, 2026-09-04, as part
    # of shrinking the Docker VM itself to 10 GB / 6 CPUs (see ~/.wslconfig).
    #
    # The container cannot stay at 12g once the VM is 10 GB -- 2 GB has to be
    # left for the VM kernel and the Docker daemon, or the container can claim
    # the whole VM and reinstate the VM-wide OOM this per-container limit
    # exists to prevent (see the top of this block).
    #
    # 8g IS THE LIMIT THAT OOM-KILLED TWICE (BI-27). It is safe now only
    # because of the CORE cut, and that dependency must not be forgotten:
    # HALVING THE CORES HALVES THE COMPILERS. ninja takes -j from nproc, so
    # 6 cores yields ~7 concurrent clang++ rather than 14. Reprojecting the
    # MEASURED Cards peak:
    #
    #   JVMs      4621 MB   (unchanged -- daemons do not scale with cores)
    #   clang++   1687 MB   ( 7 x 241 MB, down from 14 x 241 = 3378 MB)
    #             -------
    #             6308 MB   = 77% of 8192 MB
    #
    # against 8003 MB = 98% of the SAME 8 GiB limit at 12 cores. Identical
    # limit, 21 points of headroom bought purely by halving the cores.
    #
    # SO: do not widen RUNNER_CPUSET back to 0-11 at this mem_limit. That
    # combination is exactly the one that failed twice.
    #
    # If a build OOMs at 8g, do NOT raise it back -- the next lever is reducing
    # RESIDENCY (fewer/smaller daemons). See rules/build-concurrency.md in
    # bonkey-org: serialising bounds execution, not residency.
    #
    # NOTE the same trap documented below for the JVM applies to Node, and Node
    # is what died: runtimes here size themselves from the VM's 15.31 GiB, not
    # from this limit. Node happens to default to ~4 GiB so the arithmetic above
    # holds, but nothing ENFORCES it. If this recurs, cap it explicitly with
    # NODE_OPTIONS=--max-old-space-size=<MiB> rather than raising mem_limit again.
    mem_limit: ${RUNNER_MEM_LIMIT:-8g}
    # Equal to mem_limit == container swap disabled. The VM has only 4 GiB of
    # swap in total, so letting each runner swap its whole limit would oversell
    # it several times over and trade a fast, legible OOM for host-wide
    # thrashing -- the "job died at ~600s, log says nothing" failure mode.
    memswap_limit: ${RUNNER_MEM_LIMIT:-8g}
    # Ephemeral runners exit after one job; restart to pick up the next.
    restart: ${RUNNER_RESTART:-unless-stopped}
    stop_grace_period: 90s
    env_file:
      - .env
    environment:
      GITHUB_ORG: ${GITHUB_ORG:-Bonkey-Apps}
      RUNNER_LABELS: ${RUNNER_LABELS:-}
      RUNNER_GROUP: ${RUNNER_GROUP:-Default}
      RUNNER_EPHEMERAL: ${RUNNER_EPHEMERAL:-true}
      # Absolute -Xmx, deliberately not a percentage. Measured on Docker
      # Desktop/WSL2 2026-08-23: a JDK 17 JVM in this image reports
      # UseContainerSupport=true and reads the right cgroup value, yet still
      # sizes its heap from the VM's 15.31 GiB rather than the container limit
      # -- `-m 1g`, `-m 2g` and `-m 4g` ALL yielded a 3920 MiB max heap, and
      # MaxRAMPercentage=50 yielded 7840 MiB (50% of the VM, not of the limit).
      #
      # That is why mem_limit cannot ship alone: a Gradle JVM would grow a
      # 3.8 GiB heap inside a 6g container, then be OOM-killed mid-build
      # instead of collecting garbage. Absolute sizing IS honoured
      # (-Xmx1500m -> exactly 1500 MiB), so it is what we set.
      #
      # CAVEAT: `android/` is generated by `expo prebuild`, so if the Expo
      # template writes `org.gradle.jvmargs` it takes precedence over this for
      # the Gradle daemon specifically. Confirm against a real Android build
      # before trusting this number to bound that JVM; it still governs every
      # other java process (sdkmanager, bundletool, the wrapper).
      # KNOWN SIDE EFFECT: every JVM launch now prints
      #   Picked up JAVA_TOOL_OPTIONS: -Xmx2g
      # to STDERR (verified in the running container). Harmless to humans, but
      # it WILL appear in job logs and would corrupt any step that parses java
      # stderr -- `java -version` output in particular. If that bites, the
      # narrower lever is GRADLE_OPTS, which reaches the process that actually
      # needs bounding without touching sdkmanager/bundletool.
      #
      # Set to an empty string in .env to opt out entirely.
      JAVA_TOOL_OPTIONS: ${RUNNER_JAVA_TOOL_OPTIONS--Xmx2g}

services:
  runner:
    <<: *runner
    cpuset: "${RUNNER_CPUSET:-0-5}"

  # Extra runners, off by default so a 2-core laptop keeps the single-runner
  # behaviour with no flags. Each pins its OWN cores, so they run genuinely in
  # parallel instead of contending.
  #
  # Extra runners stay narrow because cores are priced in MEMORY: ninja
  # takes its -j from `nproc`, so every core added buys another concurrent
  # clang++ inside the same mem_limit. MEASURED 2026-08-28 from a kernel
  # OOM process table: a clang++ averages 241 MiB, max 678 -- NOT the
  # ~1 GiB previously assumed here, which was a guess and was 4x out.
  # Widening is a real option -- it needs the per-core peak measured first,
  # and BONKEY_NATIVE_BUILD_JOBS in entrypoint.sh moved in lockstep.
  # Do not widen on core count alone:
  #   docker compose --profile x2 up -d   # 2 runners: cores 0-1, 2-3
  #   docker compose --profile x3 up -d   # 3 runners: adds cores 4-5
  # Check the host has the cores first (`docker info --format '{{.NCPU}}'`)
  # and override RUNNER_CPUSET* in .env if the layout differs.
  runner-2:
    <<: *runner
    profiles: ["x2", "x3"]
    cpuset: "${RUNNER_CPUSET_2:-2-3}"

  runner-3:
    <<: *runner
    profiles: ["x3"]
    cpuset: "${RUNNER_CPUSET_3:-4-5}"
